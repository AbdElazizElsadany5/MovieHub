<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Rich Deep Dark -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0b0e" />
      <stop offset="100%" stop-color="#14141d" />
    </linearGradient>

    <!-- MovieHub Cinema Red Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30" />
      <stop offset="50%" stop-color="#e50914" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="492" height="492" x="10" y="10" rx="118" fill="none" stroke="#e50914" stroke-width="6" opacity="0.3" />

  <!-- Play Circle Outer Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#redGrad)" stroke-width="14" opacity="0.4" />

  <!-- Clean MovieHub 'M' Brand Icon -->
  <path d="M 135,135 L 195,135 L 256,230 L 317,135 L 377,135 L 377,377 L 320,377 L 320,225 L 272,300 L 240,300 L 192,225 L 192,377 L 135,377 Z" fill="url(#redGrad)" filter="url(#glow)" />
</svg>
