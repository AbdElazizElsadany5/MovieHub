<section class="mx-auto max-w-[1500px] px-6 py-14 lg:px-8">
  <div class="mb-10 flex flex-wrap items-end justify-between gap-4">
    <div>
      <h1 class="font-display text-5xl tracking-wide">MY FAVORITES</h1>
      <p class="mt-2 text-gray-400">Movies you saved to watch later.</p>
    </div>

    @if (favorites.length) {
      <button
        (click)="clearFavorites()"
        class="rounded-xl border border-red-600/50 px-5 py-3 text-sm text-red-400 hover:bg-red-600 hover:text-white"
      >
        Clear all
      </button>
    }
  </div>

  @if (errorMessage) {
    <p class="mb-6 rounded-xl border border-amber-500/40 bg-amber-500/10 px-4 py-3 text-amber-200">{{ errorMessage }}</p>
  }

  @if (favorites.length) {
    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4">
      @for (movie of favorites; track movie._id) {
        <app-movie-card [movie]="movie" />
      }
    </div>
  } @else {
    <div class="rounded-2xl border border-dashed border-white/20 py-24 text-center">
      <div class="text-6xl text-red-500">♡</div>
      <h2 class="mt-5 font-display text-3xl">NO FAVORITES YET</h2>
      <p class="mt-3 text-gray-400">
        Start adding movies that you want to watch.
      </p>

      <a
        routerLink="/movies"
        class="mt-7 inline-block rounded-xl bg-red-600 px-6 py-3 font-semibold hover:bg-red-700"
      >
        Browse Movies
      </a>
    </div>
  }
</section>
