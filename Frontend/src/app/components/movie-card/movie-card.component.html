 <div class="group overflow-hidden rounded-2xl bg-[#1a1a22] transition duration-300 hover:-translate-y-2 hover:shadow-2xl hover:shadow-red-950/30">
  <div class="relative h-72 overflow-hidden">
    <img
      [src]="movie.poster"
      [alt]="movie.title"
      class="h-full w-full object-cover transition duration-500 group-hover:scale-110"
    />

    <button
      (click)="toggleFavorite()"
      class="absolute right-3 top-3 grid h-10 w-10 place-items-center rounded-full bg-black/60 text-xl text-white backdrop-blur hover:bg-red-600"
      [attr.aria-label]="'Add ' + movie.title + ' to favorites'"
    >
      {{ isFavorite() ? '♥' : '♡' }}
    </button>
    <button
      type="button"
      [routerLink]="['/movies', movie._id]"
      class="absolute bottom-4 left-4 right-4 translate-y-3 rounded-xl bg-red-600 py-3 font-semibold text-white opacity-0 transition duration-300 group-hover:translate-y-0 group-hover:opacity-100 hover:bg-red-700 cursor-pointer"
    >
      View Details
    </button>
  </div>

  <div class="p-4">
    <h3 class="truncate font-display text-2xl font-semibold">{{ movie.title }}</h3>

    <div class="mt-1 flex items-center justify-between text-sm">
      <span class="font-semibold text-gray-200">{{ movie.releaseYear }}</span>
      <span class="font-semibold text-amber-400">★ {{ movie.rating }}</span>
    </div>

    <div class="mt-3 flex flex-wrap gap-2">
      @for (genre of movie.genres; track genre) {
        <span class="rounded-md bg-white/10 px-2.5 py-1 text-xs font-medium text-gray-200">
          {{ genre }}
        </span>
      }
    </div>
  </div>
</div>
