<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Exact #0d0d10 to #16161e -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d10" />
      <stop offset="100%" stop-color="#16161e" />
    </linearGradient>

    <!-- MovieHub Red Brand Gradient: Exact red-600 (#dc2626) to red-700 (#b91c1c) -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Glow effect for brand red -->
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="#dc2626" stroke-width="8" opacity="0.35" />

  <!-- Outer Glowing Red Ring -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#redGrad)" stroke-width="20" filter="url(#redGlow)" />

  <!-- White Accent Dots -->
  <circle cx="256" cy="112" r="14" fill="#ffffff" />
  <circle cx="256" cy="400" r="14" fill="#ffffff" />
  <circle cx="112" cy="256" r="14" fill="#ffffff" />
  <circle cx="400" cy="256" r="14" fill="#ffffff" />

  <!-- Bold Clean 'M' Brand Logo in Red (Without Video Play Arrow) -->
  <path d="M 160,150 L 198,150 L 256,236 L 314,150 L 352,150 L 352,362 L 310,362 L 310,222 L 270,282 L 242,282 L 202,222 L 202,362 L 160,362 Z" fill="url(#redGrad)" filter="url(#redGlow)" />
</svg>
